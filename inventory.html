<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lawrence For PC — المخزون</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
.barcode-input { direction: ltr; text-align: left; font-family: monospace; }
.low-stock { color: var(--danger); font-weight: 800; }
</style>
</head>
<body>

<script src="scripts.js"></script>

<div id="app-sidebar"></div>

<div class="main">
  <div class="page-header">
    <div><h1>📦 المخزون والأجهزة</h1><p>قطع الغيار والملحقات — دعم الباركود الكامل</p></div>
    <button class="btn btn-primary" onclick="openAddItem()">+ إضافة صنف</button>
  </div>

  <div class="search-wrap">
    <span class="sw-icon">🔎</span>
    <input type="text" id="searchInput"
           placeholder="امسح الباركود أو ابحث بالاسم، الكود، الفئة..."
           oninput="renderTable()">
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>الباركود</th><th>اسم الصنف</th><th>الفئة</th>
          <th>سعر البيع</th><th>الكمية</th><th>إجراءات</th>
        </tr></thead>
        <tbody id="itemsBody">
          <tr><td colspan="6" style="text-align:center;color:var(--text2);padding:28px">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ADD / EDIT ITEM -->
<div class="overlay" id="m-item">
<div class="modal sm">
  <div class="modal-head">
    <div class="modal-title" id="m-title">إضافة صنف</div>
    <button class="close-x" onclick="closeModal('m-item')">✕</button>
  </div>
  <div class="f"><label>الباركود (تلقائي إذا تُرك فارغاً)</label>
    <input id="i-code" class="barcode-input" placeholder="LPC-xxxxxx أو امسح الباركود">
  </div>
  <div class="f"><label>اسم الصنف *</label><input id="i-name" placeholder="مثال: شاشة 15.6 Dell"></div>
  <div class="f"><label>الفئة</label>
    <select id="i-cat">
      <option value="شاشات">شاشات</option>
      <option value="رامات">رامات</option>
      <option value="تخزين">تخزين (HDD/SSD)</option>
      <option value="بطاريات">بطاريات</option>
      <option value="كيبورد">كيبورد</option>
      <option value="أجهزة كاملة">أجهزة كاملة</option>
      <option value="ملحقات">ملحقات</option>
      <option value="أخرى">أخرى</option>
    </select>
  </div>
  <div class="form-row">
    <div class="f"><label>سعر التكلفة (JOD)</label><input id="i-cost" type="number" step="0.01" min="0" placeholder="0.00"></div>
    <div class="f"><label>سعر البيع (JOD) *</label><input id="i-price" type="number" step="0.01" min="0" placeholder="0.00"></div>
  </div>
  <div class="form-row">
    <div class="f"><label>الكمية الحالية *</label><input id="i-qty" type="number" min="0" placeholder="0"></div>
    <div class="f"><label>الحد الأدنى للتنبيه</label><input id="i-min" type="number" min="0" value="3"></div>
  </div>
  <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:8px">
    <button class="btn btn-outline" onclick="closeModal('m-item')">إلغاء</button>
    <button class="btn btn-primary" onclick="saveItem()">حفظ الصنف ✓</button>
  </div>
</div></div>

<!-- ADD STOCK -->
<div class="overlay" id="m-addStock">
<div class="modal sm">
  <div class="modal-head">
    <div class="modal-title">📦 شراء / إضافة كمية</div>
    <button class="close-x" onclick="closeModal('m-addStock')">✕</button>
  </div>
  <p style="font-size:13px;color:var(--text2);margin-bottom:14px" id="addStockName"></p>
  <div class="f"><label>الكمية الواردة</label><input id="as-qty" type="number" min="1" value="1"></div>
  <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:14px">
    <button class="btn btn-outline" onclick="closeModal('m-addStock')">إلغاء</button>
    <button class="btn btn-primary" onclick="doAddStock()">إضافة للمخزون ✓</button>
  </div>
</div></div>

<!-- PRINT BARCODE -->
<div class="overlay" id="m-printBarcode">
<div class="modal sm" style="text-align:center">
  <div class="modal-head">
    <div class="modal-title">🖨️ طباعة ملصق الباركود</div>
    <button class="close-x" onclick="closeModal('m-printBarcode')">✕</button>
  </div>
  <p style="font-size:14px;font-weight:700;margin-bottom:10px" id="pb-name"></p>
  <div style="background:#fff;padding:20px;border-radius:12px;margin-bottom:16px;display:inline-block">
    <svg id="barcode-svg"></svg>
  </div>
  <button class="btn btn-primary btn-block" onclick="printBarcodeSticker()">🖨️ طباعة الملصق الآن</button>
</div></div>

<!-- CONFIRM DELETE -->
<div class="overlay" id="m-confirm">
<div class="modal sm">
  <div class="modal-head"><div class="modal-title">⚠️ تأكيد الحذف</div><button class="close-x" onclick="closeModal('m-confirm')">✕</button></div>
  <p style="color:var(--text2);font-size:14px;margin-bottom:16px" id="confirmMsg"></p>
  <div style="display:flex;gap:9px;justify-content:flex-end">
    <button class="btn btn-outline" onclick="closeModal('m-confirm')">إلغاء</button>
    <button class="btn btn-danger" id="confirmOkBtn">حذف</button>
  </div>
</div></div>

<div id="toast" class="toast"></div>
<div id="scanIndicator" class="scan-indicator">📡 <span id="scanCode"></span></div>

<script type="module">
import { initializeApp }  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const CFG = {apiKey:'AIzaSyA6xALG_Z-FHMClMSw9GnDey7mJYibnXhY',authDomain:'lorans-2.firebaseapp.com',projectId:'lorans-2',storageBucket:'lorans-2.firebasestorage.app',messagingSenderId:'399952166847',appId:'1:399952166847:web:ac71d3e0d9afe4be8c2b0a'};
const app=initializeApp(CFG);const auth=getAuth(app);const db=getFirestore(app);

let allItems=[], editId=null, stockTargetId=null, currentBarcodeToPrint=null, currentItemNameToPrint=null;

onAuthStateChanged(auth, user => {
  if(!user){location.href='index.html';return}
  const u=JSON.parse(sessionStorage.getItem('lpc_user')||'{}');
  if(u.role!=='admin'){location.href='technician.html';return}
  renderSidebar('inventory');
  onSnapshot(collection(db,'inventory'), snap => {
    allItems=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderTable();
  });
});

function renderTable() {
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  let rows=allItems;
  if(q) rows=rows.filter(i=>(i.code||'').toLowerCase().includes(q)||(i.name||'').toLowerCase().includes(q)||(i.cat||'').toLowerCase().includes(q));

  document.getElementById('itemsBody').innerHTML=rows.length?rows.map(i=>{
    const lowClass=i.qty<=(i.min||0)?'low-stock':'';
    return `<tr>
      <td><code style="font-size:12px;color:var(--primary)">${i.code||'—'}</code></td>
      <td><strong>${i.name}</strong></td>
      <td><span class="badge" style="background:var(--pdim);color:var(--pdark)">${i.cat||'—'}</span></td>
      <td><strong>${(i.price||0).toFixed(2)} د.أ</strong><br><span style="font-size:11px;color:var(--text3)">تكلفة: ${(i.cost||0).toFixed(2)}</span></td>
      <td><span class="${lowClass}" style="font-size:15px;font-weight:900">${i.qty}</span></td>
      <td style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="btn btn-success btn-sm" onclick="openAddStock('${i.id}')" title="إضافة كمية">➕</button>
        <button class="btn btn-info btn-sm" onclick="openPrintBarcode('${i.code||''}','${(i.name||'').replace(/'/g,'')}')" title="طباعة ملصق">🖨️</button>
        <button class="btn btn-outline btn-sm" onclick="openEditItem('${i.id}')" title="تعديل">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDel('${i.id}','${(i.name||'').replace(/'/g,'')}')" title="حذف">🗑️</button>
      </td>
    </tr>`;
  }).join(''):'<tr><td colspan="6" style="text-align:center;color:var(--text2);padding:28px">لا توجد أصناف</td></tr>';
}

window.openAddItem=function(){editId=null;document.getElementById('m-title').textContent='إضافة صنف جديد';['i-code','i-name','i-cost','i-price','i-qty'].forEach(id=>document.getElementById(id).value='');document.getElementById('i-min').value='3';openModal('m-item')};
window.openEditItem=function(id){editId=id;const i=allItems.find(x=>x.id===id);if(!i)return;document.getElementById('m-title').textContent='تعديل صنف';document.getElementById('i-code').value=i.code||'';document.getElementById('i-name').value=i.name||'';document.getElementById('i-cat').value=i.cat||'أخرى';document.getElementById('i-cost').value=i.cost||0;document.getElementById('i-price').value=i.price||0;document.getElementById('i-qty').value=i.qty||0;document.getElementById('i-min').value=i.min||3;openModal('m-item')};
window.saveItem=async function(){let code=document.getElementById('i-code').value.trim();const name=document.getElementById('i-name').value.trim(),cat=document.getElementById('i-cat').value,cost=parseFloat(document.getElementById('i-cost').value)||0,price=parseFloat(document.getElementById('i-price').value)||0,qty=parseInt(document.getElementById('i-qty').value)||0,min=parseInt(document.getElementById('i-min').value)||0;if(!name){toast('⚠️ أدخل اسم الصنف');return}if(!code)code='LPC'+Math.floor(100000+Math.random()*900000);const data={code,name,cat,cost,price,qty,min,updatedAt:serverTimestamp()};if(editId){await updateDoc(doc(db,'inventory',editId),data);toast('✅ تم التعديل')}else{data.createdAt=serverTimestamp();await addDoc(collection(db,'inventory'),data);toast('✅ تمت الإضافة')}closeModal('m-item')};
window.openAddStock=function(id){stockTargetId=id;const i=allItems.find(x=>x.id===id);document.getElementById('addStockName').textContent=`الصنف: ${i?.name} (الرصيد الحالي: ${i?.qty})`;document.getElementById('as-qty').value='1';openModal('m-addStock');setTimeout(()=>document.getElementById('as-qty').focus(),100)};
window.doAddStock=async function(){const n=parseInt(document.getElementById('as-qty').value)||0;if(n<=0){toast('⚠️ أدخل كمية صحيحة');return}const i=allItems.find(x=>x.id===stockTargetId);await updateDoc(doc(db,'inventory',stockTargetId),{qty:(i.qty||0)+n});closeModal('m-addStock');toast(`✅ تمت إضافة ${n} وحدة`)};
window.confirmDel=function(id,name){document.getElementById('confirmMsg').textContent=`هل أنت متأكد من حذف "${name}"؟`;document.getElementById('confirmOkBtn').onclick=async()=>{await deleteDoc(doc(db,'inventory',id));closeModal('m-confirm');toast('🗑️ تم الحذف')};openModal('m-confirm')};

window.openPrintBarcode=function(code,name){if(!code||code==='—'){toast('⚠️ هذا الصنف لا يمتلك باركود');return}currentBarcodeToPrint=code;currentItemNameToPrint=name;document.getElementById('pb-name').textContent=name;JsBarcode('#barcode-svg',code,{format:'CODE128',lineColor:'#000',width:2,height:60,displayValue:true});openModal('m-printBarcode')};
window.printBarcodeSticker=function(){const svgHtml=document.getElementById('barcode-svg').outerHTML;const w=window.open('','_blank','width=400,height=300');w.document.write(`<!DOCTYPE html><html><head><title>Barcode</title><style>body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:15px;font-family:sans-serif}.name{font-size:13px;font-weight:bold;margin-bottom:5px;text-align:center}@media print{@page{margin:0}body{padding:5mm}}</style></head><body><div class="name">Lawrence For PC<br>${currentItemNameToPrint}</div>${svgHtml}<script>window.onload=function(){window.print();window.close()}<\/script></body></html>`);w.document.close()};

// Barcode scanner override — فتح إضافة كمية إذا عُثر على الصنف
window.onBarcodeInput=function(code){const found=allItems.find(i=>i.code===code);if(found){window.openAddStock(found.id)}else{document.getElementById('searchInput').value=code;renderTable();toast('⚠️ صنف غير مسجل — يمكنك إضافته')}};

window.doLogout=async function(){await signOut(auth);sessionStorage.removeItem('lpc_user');location.href='index.html'};
</script>
</body>
</html>
