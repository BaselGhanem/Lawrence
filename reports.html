<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lawrence For PC — التقارير</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="stylesheet" href="style.css">
<style>
.stats { grid-template-columns: repeat(3,1fr); }
.filters { align-items: center; }
.month-sel {
  background: rgba(255,255,255,.04); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 12px; color: var(--text);
  font-family: 'Tajawal', sans-serif; font-size: 13px; outline: none;
}
[data-theme="light"] .month-sel { background: #F8FAFC; }
</style>
</head>
<body>

<script src="scripts.js"></script>
<div id="app-sidebar"></div>

<div class="main">
  <div class="page-header">
    <div><h1>📊 التقارير المالية</h1><p>الإيرادات، المصاريف، وصافي الربح</p></div>
  </div>

  <div class="filters">
    <span style="font-size:12px;font-weight:700;color:var(--text2)">تصفية:</span>
    <select id="monthFilter" class="month-sel" onchange="renderReports()">
      <option value="all">كل الأوقات</option>
    </select>
  </div>

  <div class="stats mb-16" id="reportStats">
    <div class="stat-card c-green"><div class="stat-label">الإيرادات</div><div class="stat-val">—</div></div>
    <div class="stat-card c-red"><div class="stat-label">المصاريف</div><div class="stat-val">—</div></div>
    <div class="stat-card c-blue"><div class="stat-label">صافي الربح</div><div class="stat-val">—</div></div>
  </div>

  <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px">
    <!-- إيرادات -->
    <div class="card">
      <div class="card-head"><div class="card-title">💰 سجل الإيرادات (صيانة + مبيعات)</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>المرجع</th><th>العميل</th><th>المبلغ</th><th>النوع</th><th>التاريخ</th></tr></thead>
          <tbody id="incomeBody"><tr><td colspan="5" style="text-align:center;color:var(--text2);padding:24px">جاري التحميل...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- إضافة مصروف -->
    <div class="card">
      <div class="card-head"><div class="card-title">➕ تسجيل مصروف</div></div>
      <div class="f"><label>وصف المصروف *</label><input id="en" placeholder="مثال: فاتورة كهرباء"></div>
      <div class="f"><label>المبلغ (JOD) *</label><input id="ea" type="number" step="0.01" min="0"></div>
      <div class="f"><label>التصنيف</label>
        <select id="ec"><option>تشغيلية</option><option>مشتريات</option><option>مرتجعات</option><option>أخرى</option></select>
      </div>
      <div class="f mb-16"><label>التاريخ *</label><input id="ed" type="date"></div>
      <button class="btn btn-primary btn-block" onclick="addExpense()">تسجيل المصروف ✓</button>
    </div>
  </div>

  <!-- سجل المصاريف -->
  <div class="card mt-16">
    <div class="card-head"><div class="card-title">💸 سجل المصاريف</div></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>الوصف</th><th>التصنيف</th><th>المبلغ</th><th>التاريخ</th><th>حذف</th></tr></thead>
        <tbody id="expensesBody"><tr><td colspan="5" style="text-align:center;color:var(--text2);padding:24px">جاري التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="scanIndicator" class="scan-indicator">📡 <span id="scanCode"></span></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const CFG={apiKey:'AIzaSyA6xALG_Z-FHMClMSw9GnDey7mJYibnXhY',authDomain:'lorans-2.firebaseapp.com',projectId:'lorans-2',storageBucket:'lorans-2.firebasestorage.app',messagingSenderId:'399952166847',appId:'1:399952166847:web:ac71d3e0d9afe4be8c2b0a'};
const app=initializeApp(CFG);const auth=getAuth(app);const db=getFirestore(app);

let allInvoices=[],allExpenses=[],allSales=[];

onAuthStateChanged(auth,user=>{
  if(!user){location.href='index.html';return}
  const u=JSON.parse(sessionStorage.getItem('lpc_user')||'{}');
  if(u.role!=='admin'){location.href='technician.html';return}
  renderSidebar('reports');
  document.getElementById('ed').valueAsDate=new Date();
  onSnapshot(collection(db,'invoices'),snap=>{allInvoices=snap.docs.map(d=>({id:d.id,...d.data(),type:'صيانة'}));updateMonthFilter();renderReports()});
  onSnapshot(collection(db,'sales'),snap=>{allSales=snap.docs.map(d=>({id:d.id,...d.data(),type:'مبيعات'}));updateMonthFilter();renderReports()});
  onSnapshot(collection(db,'expenses'),snap=>{allExpenses=snap.docs.map(d=>({id:d.id,...d.data()}));updateMonthFilter();renderReports()});
});

function updateMonthFilter(){
  const sel=document.getElementById('monthFilter'),cur=sel.value;
  const months=new Set();
  const addM=d=>{if(!d)return;const dt=d.toDate?d.toDate():new Date(d);if(!isNaN(dt))months.add(`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`)};
  allInvoices.forEach(i=>addM(i.createdAt));allSales.forEach(s=>addM(s.createdAt));allExpenses.forEach(e=>addM(e.date||e.createdAt));
  const sorted=Array.from(months).sort().reverse();
  sel.innerHTML='<option value="all">كل الأوقات</option>'+sorted.map(m=>`<option value="${m}">${m}</option>`).join('');
  if(sorted.includes(cur))sel.value=cur;
}

window.renderReports=function(){
  const filter=document.getElementById('monthFilter').value;
  const byMonth=(item,field)=>{if(filter==='all')return true;const d=item[field];if(!d)return false;const dt=d.toDate?d.toDate():new Date(d);if(isNaN(dt))return false;return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`===filter};
  const invs=allInvoices.filter(i=>byMonth(i,'createdAt'));
  const sales=allSales.filter(s=>byMonth(s,'createdAt'));
  const exps=allExpenses.filter(e=>byMonth(e,e.date?'date':'createdAt'));
  const totalIncome=invs.reduce((s,i)=>s+(i.total||0),0)+sales.reduce((s,i)=>s+(i.total||0),0);
  const totalExp=exps.reduce((s,e)=>s+(e.amount||0),0);
  const net=totalIncome-totalExp;
  const netColor=net>=0?'var(--success)':'var(--danger)';

  document.getElementById('reportStats').innerHTML=`
    <div class="stat-card c-green"><div class="stat-label">إجمالي الإيرادات</div><div class="stat-val" style="color:var(--success)">${totalIncome.toFixed(2)}<div class="stat-sub">دينار أردني</div></div><div class="stat-icon">💰</div></div>
    <div class="stat-card c-red"><div class="stat-label">إجمالي المصاريف</div><div class="stat-val" style="color:var(--danger)">${totalExp.toFixed(2)}<div class="stat-sub">دينار أردني</div></div><div class="stat-icon">💸</div></div>
    <div class="stat-card c-blue"><div class="stat-label">صافي الربح</div><div class="stat-val" style="color:${netColor}">${net.toFixed(2)}<div class="stat-sub">دينار أردني</div></div><div class="stat-icon">📈</div></div>`;

  const combined=[...invs,...sales].sort((a,b)=>(b.createdAt?.toMillis?.()??0)-(a.createdAt?.toMillis?.()??0));
  document.getElementById('incomeBody').innerHTML=combined.length?combined.map(i=>`
    <tr>
      <td><strong style="color:var(--primary)">${i.ticketId||i.invoiceNumber||'—'}</strong></td>
      <td>${i.customerName||'—'}</td>
      <td><strong style="color:var(--success)">${(i.total||0).toFixed(2)} د.أ</strong></td>
      <td><span style="font-size:11px;background:var(--pdim);color:var(--primary);padding:2px 7px;border-radius:10px">${i.type}</span></td>
      <td style="font-size:12px;color:var(--text2)">${fmtDate(i.createdAt)}</td>
    </tr>`).join(''):'<tr><td colspan="5" style="text-align:center;color:var(--text2);padding:24px">لا توجد إيرادات</td></tr>';

  document.getElementById('expensesBody').innerHTML=exps.length?[...exps].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(e=>`
    <tr>
      <td><strong>${e.name}</strong></td>
      <td><span style="font-size:11px;background:var(--idim);color:var(--info);padding:2px 8px;border-radius:10px">${e.category}</span></td>
      <td><strong style="color:var(--danger)">${(e.amount||0).toFixed(2)} د.أ</strong></td>
      <td style="font-size:12px;color:var(--text2)">${e.date||'—'}</td>
      <td><button class="btn btn-danger btn-sm" onclick="delExp('${e.id}')">🗑️</button></td>
    </tr>`).join(''):'<tr><td colspan="5" style="text-align:center;color:var(--text2);padding:24px">لا توجد مصاريف</td></tr>';
};

window.addExpense=async function(){
  const name=document.getElementById('en').value.trim(),amount=parseFloat(document.getElementById('ea').value),cat=document.getElementById('ec').value,date=document.getElementById('ed').value;
  if(!name||!amount||amount<=0||!date){toast('⚠️ يرجى تعبئة جميع الحقول');return}
  await addDoc(collection(db,'expenses'),{name,amount,category:cat,date,createdAt:serverTimestamp()});
  document.getElementById('en').value='';document.getElementById('ea').value='';
  toast('✅ تمت إضافة المصروف');
};
window.delExp=async function(id){if(!confirm('حذف هذا المصروف؟'))return;await deleteDoc(doc(db,'expenses',id));toast('🗑️ تم الحذف')};

function fmtDate(ts){if(!ts?.toDate)return'—';return ts.toDate().toLocaleDateString('ar-JO',{year:'numeric',month:'short',day:'numeric'})}
window.doLogout=async function(){await signOut(auth);sessionStorage.removeItem('lpc_user');location.href='index.html'};
</script>
</body>
</html>
