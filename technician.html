<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lawrence For PC — الفني (POS)</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="stylesheet" href="style.css">
<style>
.grid-pos { display: grid; grid-template-columns: 1fr 360px; gap: 18px; }
.pos-search {
  width: 100%; padding: 12px 16px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text);
  font-family: 'Tajawal', sans-serif; font-size: 15px;
  outline: none; margin-bottom: 14px;
}
.pos-search:focus { border-color: var(--primary); }
.items-grid {
  display: grid; grid-template-columns: repeat(auto-fill,minmax(130px,1fr));
  gap: 8px; max-height: 380px; overflow-y: auto;
}
.item-card {
  background: var(--surface2); padding: 10px; border-radius: 9px;
  cursor: pointer; text-align: center; border: 1px solid var(--border);
  transition: .2s;
}
.item-card:hover { border-color: var(--primary); background: var(--pdim); }
.item-card .ic-name { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
.item-card .ic-price { color: var(--primary); font-size: 13px; font-weight: 700; }
.item-card .ic-qty { font-size: 11px; color: var(--text3); }
.other-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.other-row input { flex: 1; min-width: 80px; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Tajawal', sans-serif; font-size: 13px; outline: none; }
.other-row input:focus { border-color: var(--primary); }
.total-box { background: var(--surface2); padding: 18px; border-radius: 12px; text-align: center; margin-top: 16px; }
.total-lbl { font-size: 12px; color: var(--text2); }
.total-val { font-size: 28px; font-weight: 900; color: var(--primary); margin: 6px 0; }
.mode-toggle { display: flex; gap: 5px; background: var(--surface2); padding: 4px; border-radius: 10px; margin-bottom: 16px; }
.mode-btn { flex: 1; padding: 8px; border-radius: 8px; border: none; cursor: pointer; font-family: 'Tajawal', sans-serif; font-size: 13px; font-weight: 700; background: transparent; color: var(--text2); transition: .2s; }
.mode-btn.active { background: var(--primary); color: #000; }
[data-theme="light"] .pos-search, [data-theme="light"] .other-row input { background: #F8FAFC; }
@media print {
  .sidebar, #app-sidebar, .btn, .mode-toggle, .pos-search,
  .items-grid, .other-row, #toast, #scanIndicator { display: none !important; }
  .main { margin-right: 0 !important; }
  .grid-pos { display: block !important; }
}
</style>
</head>
<body>

<script src="scripts.js"></script>
<div id="app-sidebar"></div>

<div class="main">
  <div class="page-header">
    <div><h1>🛒 نقطة البيع</h1><p>بيع القطع والأجهزة بشكل سريع</p></div>
  </div>

  <div class="grid-pos">
    <!-- القسم الأيمن: المنتجات -->
    <div class="card">
      <div class="mode-toggle">
        <button class="mode-btn active" id="btnSale" onclick="setMode('sale')">وضع البيع</button>
        <button class="mode-btn" id="btnReturn" onclick="setMode('return')">وضع المرتجعات</button>
      </div>
      <input type="text" id="customerName" class="pos-search" placeholder="اسم العميل (اختياري)">
      <select id="productSelect" class="pos-search" style="cursor:pointer" onchange="addSelectedProduct()">
        <option value="">— اختر منتج من القائمة —</option>
      </select>
      <input type="text" id="posSearch" class="pos-search" placeholder="🔎 ابحث بالاسم أو امسح الباركود..." oninput="searchItems()">
      <div class="items-grid" id="itemsGrid"></div>
      <div class="other-row">
        <input type="text" id="otherName" placeholder="صنف خارجي (اسم)">
        <input type="number" id="otherPrice" placeholder="السعر" step="0.01" style="width:90px">
        <input type="number" id="otherQty" placeholder="كمية" value="1" style="width:70px">
        <button class="btn btn-primary btn-sm" onclick="addOtherItem()">+ إضافة</button>
      </div>
    </div>

    <!-- القسم الأيسر: السلة -->
    <div class="card">
      <div class="card-head"><div class="card-title">🛒 السلة</div><button class="btn btn-danger btn-sm" onclick="clearCart()">تفريغ</button></div>
      <div style="max-height:340px;overflow-y:auto">
        <table class="cart-table">
          <thead><tr><th>الصنف</th><th>الكمية</th><th>المجموع</th><th></th></tr></thead>
          <tbody id="cartBody"></tbody>
        </table>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin:12px 0">
        <label style="font-size:13px;font-weight:700;color:var(--text2)">ضريبة %</label>
        <input type="number" id="taxRate" value="0" step="0.5" style="width:70px;padding:7px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;outline:none" oninput="updateCart()">
      </div>
      <div class="total-box">
        <div class="total-lbl">المجموع الفرعي</div>
        <div class="total-val" id="subtotal" style="font-size:20px">0.00 د.أ</div>
        <div class="total-lbl">الضريبة / الإجمالي</div>
        <div class="total-val" id="totalSum">0.00 د.أ</div>
        <button class="btn btn-primary btn-block mt-8" onclick="completeSale()">✅ إتمام العملية</button>
        <button class="btn btn-outline btn-block mt-8" onclick="printInvoice()">🖨️ طباعة الفاتورة</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="scanIndicator" class="scan-indicator">📡 <span id="scanCode"></span></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp, doc, updateDoc, increment }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const CFG={apiKey:'AIzaSyA6xALG_Z-FHMClMSw9GnDey7mJYibnXhY',authDomain:'lorans-2.firebaseapp.com',projectId:'lorans-2',storageBucket:'lorans-2.firebasestorage.app',messagingSenderId:'399952166847',appId:'1:399952166847:web:ac71d3e0d9afe4be8c2b0a'};
const app=initializeApp(CFG);const auth=getAuth(app);const db=getFirestore(app);

let inventory=[],cart=[],isReturnMode=false;

onAuthStateChanged(auth, user => {
  if(!user){location.href='index.html';return}
  renderSidebar('sales');
  onSnapshot(collection(db,'inventory'),snap=>{
    inventory=snap.docs.map(d=>({id:d.id,...d.data()}));
    updateProductSelect();searchItems();
  });
});

function updateProductSelect(){
  const sel=document.getElementById('productSelect');
  sel.innerHTML='<option value="">— اختر منتج من القائمة —</option>'+
    inventory.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} (${(p.price||0).toFixed(2)} د.أ) — متوفر: ${p.qty||0}</option>`).join('');
}
window.addSelectedProduct=function(){const id=document.getElementById('productSelect').value;if(id)addToCart(id);document.getElementById('productSelect').value=''};

function renderItems(list){
  const container=document.getElementById('itemsGrid');
  if(!list.length){container.innerHTML='<div style="text-align:center;padding:20px;color:var(--text2);grid-column:1/-1">لا توجد أصناف</div>';return}
  container.innerHTML=list.map(i=>`
    <div class="item-card" onclick="addToCart('${i.id}')">
      <div class="ic-name">${escapeHtml(i.name)}</div>
      <div class="ic-price">${(i.price||0).toFixed(2)} د.أ</div>
      <div class="ic-qty">المتوفر: ${i.qty||0}</div>
    </div>`).join('');
}
window.searchItems=function(){const q=document.getElementById('posSearch').value.trim().toLowerCase();renderItems(q?inventory.filter(i=>(i.name||'').toLowerCase().includes(q)||(i.code||'').toLowerCase().includes(q)||(i.cat||'').toLowerCase().includes(q)):inventory)};

function escapeHtml(str){if(!str)return'';return String(str).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}

window.addToCart=function(id){const item=inventory.find(x=>x.id===id);if(!item)return;const existing=cart.find(x=>x.id===id&&!x.isOther);if(existing){if(!isReturnMode&&existing.cartQty+1>(item.qty||0)){toast('❌ الكمية غير متوفرة');return}existing.cartQty++}else{if(!isReturnMode&&1>(item.qty||0)){toast('❌ الكمية غير متوفرة');return}cart.push({...item,cartQty:1,isOther:false})}updateCart()};
window.addOtherItem=function(){const name=document.getElementById('otherName').value.trim();const price=parseFloat(document.getElementById('otherPrice').value);let qty=parseInt(document.getElementById('otherQty').value)||1;if(!name||isNaN(price)||price<=0){toast('⚠️ أدخل اسم وسعر');return}cart.push({id:'other_'+Date.now(),name:name+' (خارجي)',price,cartQty:qty,isOther:true});document.getElementById('otherName').value='';document.getElementById('otherPrice').value='';document.getElementById('otherQty').value='1';updateCart()};
window.updateCart=function(){let subtotal=0;const tbody=document.getElementById('cartBody');tbody.innerHTML='';cart.forEach((i,idx)=>{const total=i.price*i.cartQty;subtotal+=total;const tr=document.createElement('tr');tr.innerHTML=`<td>${escapeHtml(i.name)}</td><td><span style="display:inline-flex;align-items:center;gap:6px"><button class="qty-ctrl" style="width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer" onclick="changeQty(${idx},-1)">-</button>${i.cartQty}<button class="qty-ctrl" style="width:22px;height:22px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer" onclick="changeQty(${idx},1)">+</button></span></td><td><strong>${total.toFixed(2)}</strong></td><td><button onclick="remItem(${idx})" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:15px">✕</button></td>`;tbody.appendChild(tr)});const taxRate=parseFloat(document.getElementById('taxRate').value)||0;const taxAmt=subtotal*taxRate/100;const total=subtotal+taxAmt;document.getElementById('subtotal').textContent=subtotal.toFixed(2)+' د.أ';document.getElementById('totalSum').textContent=(isReturnMode?-total:total).toFixed(2)+' د.أ'};
window.changeQty=function(idx,delta){const item=cart[idx];const newQty=item.cartQty+delta;if(newQty<1){remItem(idx);return}if(!isReturnMode&&!item.isOther){const orig=inventory.find(i=>i.id===item.id);if(orig&&newQty>orig.qty){toast(`❌ الحد الأقصى ${orig.qty}`);return}}item.cartQty=newQty;updateCart()};
window.remItem=(idx)=>{cart.splice(idx,1);updateCart()};
window.clearCart=()=>{cart=[];updateCart()};
window.setMode=(m)=>{isReturnMode=m==='return';document.getElementById('btnSale').classList.toggle('active',!isReturnMode);document.getElementById('btnReturn').classList.toggle('active',isReturnMode);toast(isReturnMode?'⚠️ وضع المرتجعات':'✅ وضع البيع')};

window.completeSale=async function(){
  if(!cart.length){toast('⚠️ السلة فارغة');return}
  if(!isReturnMode){for(const item of cart){if(!item.isOther){const orig=inventory.find(i=>i.id===item.id);if(!orig||(orig.qty||0)<item.cartQty){toast(`❌ الكمية غير كافية: ${item.name}`);return}}}}
  const subtotal=cart.reduce((s,i)=>s+(i.price*i.cartQty),0);
  const taxRate=parseFloat(document.getElementById('taxRate').value)||0;
  const taxAmt=subtotal*taxRate/100;
  const total=subtotal+taxAmt;
  const customer=document.getElementById('customerName').value.trim()||'عميل نقدي';
  for(const item of cart){if(!item.isOther)await updateDoc(doc(db,'inventory',item.id),{qty:increment(isReturnMode?item.cartQty:-item.cartQty)})}
  await addDoc(collection(db,'sales'),{customerName:customer,cart:cart.map(c=>({name:c.name,price:c.price,qty:c.cartQty,isOther:c.isOther||false})),subtotal,taxRate,taxAmount:taxAmt,total:isReturnMode?-total:total,type:isReturnMode?'مرتجع':'بيع',createdAt:serverTimestamp()});
  cart=[];updateCart();toast('✅ تمت العملية');
  if(!isReturnMode)printInvoice();
};

window.printInvoice=function(){
  if(!cart.length&&!isReturnMode){toast('⚠️ لا توجد أصناف');return}
  const customer=document.getElementById('customerName').value.trim()||'عميل نقدي';
  const subtotal=cart.reduce((s,i)=>s+(i.price*i.cartQty),0);
  const taxRate=parseFloat(document.getElementById('taxRate').value)||0;
  const taxAmt=subtotal*taxRate/100;
  const total=subtotal+taxAmt;
  const now=new Date().toLocaleString('ar-JO');
  const rows=cart.map(i=>`<tr><td>${escapeHtml(i.name)}</td><td>${i.cartQty}</td><td>${i.price.toFixed(2)}</td><td>${(i.price*i.cartQty).toFixed(2)}</td></tr>`).join('');
  const w=window.open('','_blank','width=600,height=800');
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>فاتورة</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet"><style>body{font-family:Tajawal,sans-serif;padding:20px;max-width:680px;margin:auto}.hdr{text-align:center;border-bottom:2px solid #F59E0B;padding-bottom:12px;margin-bottom:16px}.logo{width:70px;border-radius:12px}h1{color:#B45309;font-size:20px;margin:6px 0}table{width:100%;border-collapse:collapse;margin:14px 0}th,td{border:1px solid #ddd;padding:8px;text-align:right}th{background:#f5f5f5}.tot{font-size:18px;font-weight:900;color:#F59E0B}.ftr{text-align:center;font-size:11px;color:#777;margin-top:16px}@media print{body{margin:0}}</style></head><body><div class="hdr"><img class="logo" src="logo.jpg" onerror="this.style.display='none'"><h1>Lawrence For PC</h1><div>مركز صيانة وبيع أجهزة الكمبيوتر</div></div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px"><div><strong>العميل:</strong> ${escapeHtml(customer)}</div><div><strong>التاريخ:</strong> ${now}</div></div><table><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${rows}</tbody></table><div style="text-align:left"><div>الفرعي: ${subtotal.toFixed(2)} د.أ</div><div>ضريبة (${taxRate}%): ${taxAmt.toFixed(2)} د.أ</div><div class="tot">الإجمالي: ${total.toFixed(2)} د.أ</div></div><div class="ftr">شكراً لثقتكم بـ Lawrence For PC</div><script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
};

// Override barcode from scripts.js
window.onBarcodeInput=function(code){document.getElementById('posSearch').value=code;searchItems();const item=inventory.find(x=>x.code===code);if(item)addToCart(item.id)};
window.doLogout=async function(){await signOut(auth);sessionStorage.removeItem('lpc_user');location.href='index.html'};
</script>
</body>
</html>
