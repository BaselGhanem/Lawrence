<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lawrence For PC — الإعداد الأولي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090F;--surface:#0D1117;--border:#1A2235;--primary:#F59E0B;--text:#F1F5F9;--text2:#94A3B8;--success:#10B981;--danger:#EF4444;--warn:#F97316}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:48px 40px;max-width:520px;width:100%;text-align:center}
.icon{font-size:52px;margin-bottom:20px}
h1{font-size:24px;font-weight:900;margin-bottom:8px}
.sub{color:var(--text2);font-size:14px;line-height:1.8;margin-bottom:32px}
.warning{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:14px 18px;font-size:13px;color:var(--danger);margin-bottom:24px;text-align:right}
.users-preview{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:24px;text-align:right}
.users-preview h3{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.user-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(26,34,53,.5);font-size:13px}
.user-row:last-child{border-bottom:none}
.user-role{background:var(--pdim,rgba(245,158,11,.12));color:var(--primary);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;margin-right:auto}
.user-role.tech{background:rgba(59,130,246,.12);color:#3B82F6}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#F59E0B,#B45309);border:none;border-radius:12px;color:#000;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:900;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.btn:hover:not(:disabled){box-shadow:0 8px 28px rgba(245,158,11,.35);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.log{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:12px;padding:16px 20px;text-align:right;margin-top:20px;display:none;max-height:220px;overflow-y:auto}
.log-line{font-size:13px;line-height:2;display:flex;align-items:center;gap:8px}
.log-line.ok{color:var(--success)}
.log-line.err{color:var(--danger)}
.log-line.info{color:var(--text2)}
.log-line.warn{color:var(--warn)}
.done-box{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:12px;padding:20px;margin-top:20px;display:none}
.done-box h3{color:var(--success);font-size:16px;font-weight:800;margin-bottom:8px}
.done-box p{color:var(--text2);font-size:13px;line-height:1.7}
.go-btn{margin-top:14px;display:inline-block;padding:10px 24px;background:var(--success);border-radius:10px;color:#fff;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;border:none}
</style>
</head>
<body>
<div class="box">
  <div class="icon">⚙️</div>
  <h1>Lawrence For PC</h1>
  <p class="sub">الإعداد الأولي للنظام — سيتم إنشاء حسابات المستخدمين وقاعدة البيانات</p>

  <div class="warning">⚠️ شغّل هذه الصفحة مرة واحدة فقط</div>

  <div class="users-preview">
    <h3>المستخدمون الذين سيتم إنشاؤهم</h3>
    <div class="user-row"><span>Admin</span><span style="color:var(--text2);font-size:12px">admin</span><span class="user-role">مدير</span></div>
    <div class="user-row"><span>Fadi X</span><span style="color:var(--text2);font-size:12px">fadix</span><span class="user-role tech">فني</span></div>
    <div class="user-row"><span>Fadi Khoshroom</span><span style="color:var(--text2);font-size:12px">fadikh</span><span class="user-role tech">فني</span></div>
  </div>

  <button class="btn" id="startBtn" onclick="runSetup()">🚀 بدء الإعداد</button>

  <div class="log" id="logBox"></div>
  <div class="done-box" id="doneBox">
    <h3>✅ تم الإعداد بنجاح!</h3>
    <p>تم إنشاء الحسابات وقاعدة البيانات.<br>يمكنك الآن الدخول للنظام.</p>
    <button class="go-btn" onclick="location.href='index.html'">الدخول للنظام ←</button>
  </div>
</div>

<script type="module">
import { initializeApp }                           from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const CFG = {
  apiKey:            "AIzaSyA6xALG_Z-FHMClMSw9GnDey7mJYibnXhY",
  authDomain:        "lorans-2.firebaseapp.com",
  projectId:         "lorans-2",
  storageBucket:     "lorans-2.firebasestorage.app",
  messagingSenderId: "399952166847",
  appId:             "1:399952166847:web:ac71d3e0d9afe4be8c2b0a"
};

const USERS = [
  { username:'admin',  displayName:'Admin',          pwd:'202605',    role:'admin' },
  { username:'fadix',  displayName:'Fadi X',          pwd:'2025-fadi', role:'technician' },
  { username:'fadikh', displayName:'Fadi Khoshroom',  pwd:'2025-nayef',role:'technician' }
];

function defaultPerms(role) {
  if (role === 'admin') return {
    viewTickets:true, createTickets:true, editTickets:true,
    deleteTickets:true, inventory:true, reports:true, manageUsers:true
  };
  return {
    viewTickets:true, createTickets:false, editTickets:true,
    deleteTickets:false, inventory:false, reports:false, manageUsers:false
  };
}

const logBox  = document.getElementById('logBox');
const doneBox = document.getElementById('doneBox');

function addLog(msg, type='info') {
  logBox.style.display = 'block';
  const d = document.createElement('div');
  d.className = 'log-line ' + type;
  const icons = { ok:'✅', err:'❌', info:'⏳', warn:'⚠️' };
  d.textContent = (icons[type]||'•') + ' ' + msg;
  logBox.appendChild(d);
  logBox.scrollTop = logBox.scrollHeight;
}

window.runSetup = async function() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = 'جاري الإعداد...';

  try {
    // Primary app — used for Firestore writes (test mode, no auth required)
    const mainApp = initializeApp(CFG, 'main');
    const db = getFirestore(mainApp);

    for (let i = 0; i < USERS.length; i++) {
      const u = USERS[i];
      addLog(`إنشاء حساب: ${u.displayName}`);

      try {
        // Separate app instance per user so signIn doesn't conflict
        const inst = initializeApp(CFG, 'inst' + i);
        const auth = getAuth(inst);
        const cred = await createUserWithEmailAndPassword(auth, `${u.username}@lorans.local`, u.pwd);

        await setDoc(doc(db, 'users', cred.user.uid), {
          username:    u.username,
          displayName: u.displayName,
          role:        u.role,
          pwd:         u.pwd,           // stored so admin can reset passwords
          permissions: defaultPerms(u.role),
          active:      true,
          createdAt:   serverTimestamp()
        });

        addLog(`${u.displayName} — تم إنشاؤه`, 'ok');

      } catch (e) {
        if (e.code === 'auth/email-already-in-use') {
          addLog(`${u.displayName} — موجود مسبقاً، تم تخطيه`, 'warn');
        } else {
          throw e;
        }
      }
    }

    // Initialize counters document
    addLog('إعداد قاعدة البيانات');
    await setDoc(doc(db, 'counters', 'main'), { tickets: 0 }, { merge: true });
    addLog('قاعدة البيانات جاهزة', 'ok');

    btn.textContent = '✅ اكتمل الإعداد';
    doneBox.style.display = 'block';

  } catch (err) {
    addLog('خطأ: ' + err.message, 'err');
    btn.disabled = false;
    btn.textContent = '🔄 إعادة المحاولة';
    console.error(err);
  }
};
</script>
</body>
</html>
