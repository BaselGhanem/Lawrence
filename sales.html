<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lawrence For PC — المبيعات</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="stylesheet" href="style.css">
<style>
/* ─── Step Form ───────────────────────────────── */
.step-wrap {
  max-width: 860px; margin: 0 auto;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 36px;
}
.step-nav { display:flex; gap:8px; margin-bottom:28px; border-bottom:1px solid var(--border); padding-bottom:14px; }
.step-dot {
  width:32px; height:32px; border-radius:50%;
  background: var(--surface2); border: 1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:900; color:var(--text2); transition:.2s;
}
.step-dot.active { background:var(--primary); color:#000; border-color:var(--primary); }
.step-dot.done   { background:var(--success); color:#fff; border-color:var(--success); }
.step-title { font-size:20px; font-weight:800; margin-bottom:20px; }
.step-page { display:none; animation:mIn .25s ease; }
.step-page.active { display:block; }
/* ─── Cart ────────────────────────────────────── */
.cart-item {
  display:flex; justify-content:space-between; align-items:center;
  background:var(--surface2); margin-bottom:8px; padding:11px 14px;
  border-radius:12px; gap:8px; flex-wrap:wrap;
}
.ci-info { flex:2; font-size:13px; font-weight:600; }
.ci-sub  { font-size:11px; color:var(--text2); margin-top:2px; }
.ci-price { color:var(--primary); font-weight:700; font-size:14px; }
.ci-qty { display:flex; align-items:center; gap:8px; background:var(--surface); padding:4px 10px; border-radius:30px; }
.ci-qty button { background:none; border:none; font-size:16px; font-weight:900; cursor:pointer; color:var(--primary); width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.ci-qty button:hover { background:var(--pdim); }
.remove-btn { background:none; border:none; color:var(--danger); cursor:pointer; font-size:17px; }
/* ─── Total ───────────────────────────────────── */
.total-row { display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--border); font-size:14px; }
.total-row.grand { font-size:18px; font-weight:900; }
.total-row.grand span:last-child { color:var(--primary); }
/* ─── Invoice Table ───────────────────────────── */
.inv-table th, .inv-table td { text-align:right; padding:9px 12px; border-bottom:1px solid var(--border); font-size:13px; }
.inv-table th { background:rgba(255,255,255,.02); font-size:11px; font-weight:700; color:var(--text2); }
.inv-table tr:last-child td { border:none; }
.action-icons button { background:none; border:none; cursor:pointer; font-size:15px; margin:0 3px; }
[data-theme="light"] .ci-qty { background:var(--surface); }
[data-theme="light"] .step-wrap { box-shadow:0 4px 20px rgba(0,0,0,.08); }
[data-theme="light"] .cart-item { background:#F8FAFC; }
</style>
</head>
<body>

<script src="scripts.js"></script>
<div id="app-sidebar"></div>

<div class="main">
  <div class="page-header">
    <div><h1>🛒 نظام المبيعات</h1><p>إنشاء فواتير البيع وإدارة السجل</p></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('new',this)">➕ فاتورة جديدة</button>
    <button class="tab-btn" onclick="switchTab('list',this)">📋 الفواتير السابقة</button>
  </div>

  <!-- ── تبويب فاتورة جديدة ── -->
  <div id="tab-new" class="tab-pane active">
    <div class="step-wrap">
      <div class="step-nav">
        <div class="step-dot active" id="sd1">1</div>
        <div style="flex:1;height:2px;background:var(--border);margin:auto 4px;border-radius:2px"></div>
        <div class="step-dot" id="sd2">2</div>
        <div style="flex:1;height:2px;background:var(--border);margin:auto 4px;border-radius:2px"></div>
        <div class="step-dot" id="sd3">3</div>
        <div style="flex:1;height:2px;background:var(--border);margin:auto 4px;border-radius:2px"></div>
        <div class="step-dot" id="sd4">4</div>
      </div>

      <!-- Step 1: اسم العميل -->
      <div class="step-page active" id="sp1">
        <div class="step-title">👤 معلومات العميل</div>
        <div class="f mb-16"><label>الاسم الكامل *</label><input id="customerName" placeholder="أحمد محمد"></div>
        <button class="btn btn-primary btn-block" onclick="goStep(2)">التالي ←</button>
      </div>

      <!-- Step 2: رقم الهاتف -->
      <div class="step-page" id="sp2">
        <div class="step-title">📞 رقم الهاتف</div>
        <div class="f mb-16"><label>رقم الهاتف *</label><input type="tel" id="customerPhone" placeholder="07xxxxxxxx" dir="ltr"></div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-outline" onclick="goStep(1)">← رجوع</button>
          <button class="btn btn-primary" style="flex:1" onclick="goStep(3)">التالي ←</button>
        </div>
      </div>

      <!-- Step 3: إضافة منتجات -->
      <div class="step-page" id="sp3">
        <div class="step-title">🛍️ اختيار المنتجات</div>
        <div class="f mb-12"><label>المنتجات من المخزون</label>
          <select id="productSelect" onchange="addProduct()">
            <option value="">— اختر منتج —</option>
          </select>
        </div>
        <div class="f mb-16">
          <label>أو أضف صنفاً خارجياً</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input type="text" id="otherName" placeholder="اسم الصنف" style="flex:2">
            <input type="number" id="otherPrice" placeholder="السعر" step="0.01" style="flex:1;min-width:80px">
            <input type="number" id="otherQty" placeholder="الكمية" value="1" style="width:70px">
            <button class="btn btn-primary btn-sm" onclick="addOther()">+ إضافة</button>
          </div>
        </div>
        <div id="cartList"></div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <button class="btn btn-outline" onclick="goStep(2)">← رجوع</button>
          <button class="btn btn-primary" style="flex:1" onclick="goStep(4)">مراجعة الفاتورة →</button>
        </div>
      </div>

      <!-- Step 4: مراجعة وإتمام -->
      <div class="step-page" id="sp4">
        <div class="step-title">📝 مراجعة الفاتورة</div>
        <div id="reviewContainer"></div>
        <div style="display:flex;gap:10px;margin-top:20px">
          <button class="btn btn-outline" onclick="goStep(3)">← رجوع</button>
          <button class="btn btn-primary" style="flex:1" onclick="completeSale()">✅ إتمام البيع وإصدار الفاتورة</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── تبويب الفواتير السابقة ── -->
  <div id="tab-list" class="tab-pane">
    <div class="card">
      <div class="card-head">
        <div class="card-title">📑 الفواتير المسجلة</div>
        <button class="btn btn-outline btn-sm" onclick="loadInvoices()">🔄 تحديث</button>
      </div>
      <div class="table-wrap">
        <table class="inv-table" style="width:100%;border-collapse:collapse">
          <thead><tr><th>رقم الفاتورة</th><th>العميل</th><th>الهاتف</th><th>المجموع</th><th>التاريخ</th><th>إجراءات</th></tr></thead>
          <tbody id="invoicesListBody"><tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text2)">اختر "الفواتير السابقة" لتحميل البيانات</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="scanIndicator" class="scan-indicator">📡 <span id="scanCode"></span></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, serverTimestamp, doc, updateDoc, deleteDoc as del, increment, runTransaction, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const CFG={apiKey:'AIzaSyA6xALG_Z-FHMClMSw9GnDey7mJYibnXhY',authDomain:'lorans-2.firebaseapp.com',projectId:'lorans-2',storageBucket:'lorans-2.firebasestorage.app',messagingSenderId:'399952166847',appId:'1:399952166847:web:ac71d3e0d9afe4be8c2b0a'};
const app=initializeApp(CFG);const auth=getAuth(app);const db=getFirestore(app);

let inventory=[],cart=[],allInvoices=[];

onAuthStateChanged(auth,user=>{
  if(!user){location.href='index.html';return}
  renderSidebar('sales');
  onSnapshot(collection(db,'inventory'),snap=>{inventory=snap.docs.map(d=>({id:d.id,...d.data()}));fillProductSelect()});
});

function fillProductSelect(){
  document.getElementById('productSelect').innerHTML=
    '<option value="">— اختر منتج —</option>'+
    inventory.filter(i=>(i.qty||0)>0).map(i=>`<option value="${i.id}">${escapeHtml(i.name)} — ${(i.price||0).toFixed(2)} د.أ (متوفر: ${i.qty})</option>`).join('');
}

// ─── Step Navigation ──────────────────────────────
const STEPS=4;
window.goStep=function(n){
  if(n===3&&!cart.length){toast('⚠️ أضف منتجاً واحداً على الأقل');return}
  if(n>1&&!document.getElementById('customerName').value.trim()){toast('⚠️ أدخل اسم العميل');goStep(1);return}
  for(let i=1;i<=STEPS;i++){
    const pg=document.getElementById('sp'+i);
    const dot=document.getElementById('sd'+i);
    if(pg){pg.classList.toggle('active',i===n)}
    if(dot){dot.classList.toggle('active',i===n);dot.classList.toggle('done',i<n)}
  }
  if(n===4)renderReview();
};

// ─── Cart ─────────────────────────────────────────
window.addProduct=function(){const id=document.getElementById('productSelect').value;if(!id)return;const item=inventory.find(x=>x.id===id);if(!item)return;const ex=cart.find(x=>x.id===id&&!x.isOther);if(ex){if(ex.cartQty+1>(item.qty||0)){toast('❌ الكمية غير متوفرة');return}ex.cartQty++}else{cart.push({...item,cartQty:1,isOther:false})}document.getElementById('productSelect').value='';renderCart()};
window.addOther=function(){const name=document.getElementById('otherName').value.trim(),price=parseFloat(document.getElementById('otherPrice').value)||0,qty=parseInt(document.getElementById('otherQty').value)||1;if(!name||price<=0){toast('⚠️ أدخل اسم وسعر');return}cart.push({id:'oth_'+Date.now(),name,price,cartQty:qty,isOther:true});document.getElementById('otherName').value='';document.getElementById('otherPrice').value='';document.getElementById('otherQty').value='1';renderCart()};
window.changeQty=function(idx,d){const item=cart[idx];const nq=item.cartQty+d;if(nq<1){cart.splice(idx,1);renderCart();return}if(!item.isOther){const orig=inventory.find(i=>i.id===item.id);if(orig&&nq>orig.qty){toast(`❌ الحد الأقصى ${orig.qty}`);return}}item.cartQty=nq;renderCart()};
window.remCart=(idx)=>{cart.splice(idx,1);renderCart()};

function renderCart(){
  const el=document.getElementById('cartList');
  if(!cart.length){el.innerHTML='<p style="color:var(--text2);font-size:13px;text-align:center;padding:20px">السلة فارغة</p>';return}
  el.innerHTML=cart.map((i,idx)=>`
    <div class="cart-item">
      <div class="ci-info">${escapeHtml(i.name)}<div class="ci-sub">${i.isOther?'خارجي':'من المخزون'}</div></div>
      <div class="ci-qty">
        <button onclick="changeQty(${idx},-1)">-</button>
        <span style="min-width:24px;text-align:center">${i.cartQty}</span>
        <button onclick="changeQty(${idx},1)">+</button>
      </div>
      <div class="ci-price">${(i.price*i.cartQty).toFixed(2)} د.أ</div>
      <button class="remove-btn" onclick="remCart(${idx})">✕</button>
    </div>`).join('');
}

function renderReview(){
  const total=cart.reduce((s,i)=>s+i.price*i.cartQty,0);
  const name=document.getElementById('customerName').value.trim()||'—';
  const phone=document.getElementById('customerPhone').value.trim()||'—';
  document.getElementById('reviewContainer').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div class="surface2-block"><div class="di-label">العميل</div><div class="di-val">${escapeHtml(name)}</div></div>
      <div class="surface2-block"><div class="di-label">الهاتف</div><div class="di-val" dir="ltr">${escapeHtml(phone)}</div></div>
    </div>
    ${cart.map(i=>`<div class="cart-item"><div class="ci-info">${escapeHtml(i.name)}</div><div class="ci-qty"><span>${i.cartQty} × ${i.price.toFixed(2)} = ${(i.price*i.cartQty).toFixed(2)} د.أ</span></div></div>`).join('')}
    <div class="total-row grand mt-12"><span>الإجمالي</span><span>${total.toFixed(2)} د.أ</span></div>`;
}

window.completeSale=async function(){
  const name=document.getElementById('customerName').value.trim(),phone=document.getElementById('customerPhone').value.trim();
  if(!name||!phone){toast('⚠️ اسم العميل ورقم الهاتف إلزاميان');return}
  if(!cart.length){toast('⚠️ السلة فارغة');return}
  for(const item of cart){if(!item.isOther){const orig=inventory.find(i=>i.id===item.id);if(!orig||(orig.qty||0)<item.cartQty){toast(`❌ الكمية غير كافية: ${item.name}`);return}}}
  const subtotal=cart.reduce((s,i)=>s+i.price*i.cartQty,0);
  // إنشاء رقم فاتورة
  const count=(allInvoices.length||0)+1;
  const invoiceNumber='INV-'+String(count).padStart(4,'0');
  for(const item of cart){if(!item.isOther)await updateDoc(doc(db,'inventory',item.id),{qty:increment(-item.cartQty)})}
  await addDoc(collection(db,'sales'),{invoiceNumber,customerName:name,customerPhone:phone,cart:cart.map(c=>({name:c.name,price:c.price,qty:c.cartQty,isOther:c.isOther||false,id:c.id||null})),subtotal,taxRate:0,taxAmount:0,total:subtotal,type:'بيع',createdAt:serverTimestamp()});
  const savedCart=[...cart];cart=[];renderCart();
  toast(`✅ تمت العملية — ${invoiceNumber}`);
  printSaleInvoice(name,phone,savedCart,subtotal,invoiceNumber);
  goStep(1);
  document.getElementById('customerName').value='';
  document.getElementById('customerPhone').value='';
};

function printSaleInvoice(customer,phone,cartItems,total,invNum){
  const now=new Date().toLocaleString('ar-JO');
  const rows=cartItems.map(i=>`<tr><td>${escapeHtml(i.name)}</td><td>${i.cartQty}</td><td>${i.price.toFixed(2)}</td><td>${(i.price*i.cartQty).toFixed(2)}</td></tr>`).join('');
  const w=window.open('','_blank','width=600,height=780');
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>${invNum}</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet"><style>body{font-family:Tajawal,Arial,sans-serif;padding:20px;max-width:660px;margin:auto}.hdr{text-align:center;border-bottom:2px solid #F59E0B;padding-bottom:12px;margin-bottom:14px}.logo{width:70px;border-radius:12px}h1{color:#B45309;font-size:20px;margin:4px 0}.row{display:flex;justify-content:space-between;font-size:13px;margin:5px 0}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid #ddd;padding:8px;text-align:right}th{background:#f5f5f5}.grand{font-size:18px;font-weight:900;color:#F59E0B;text-align:right;margin-top:10px}.ftr{text-align:center;font-size:11px;color:#777;margin-top:16px;border-top:1px dashed #ddd;padding-top:10px}@media print{body{margin:0}}</style></head><body><div class="hdr"><img class="logo" src="logo.jpg" onerror="this.style.display='none'"><h1>Lawrence For PC</h1><div>فاتورة مبيعات</div></div><div class="row"><div><strong>العميل:</strong> ${escapeHtml(customer)}</div><div><strong>الهاتف:</strong> <span dir="ltr">${escapeHtml(phone)}</span></div></div><div class="row"><div><strong>رقم الفاتورة:</strong> ${invNum}</div><div><strong>التاريخ:</strong> ${now}</div></div><table><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${rows}</tbody></table><div class="grand">الإجمالي: ${total.toFixed(2)} د.أ</div><div class="ftr">شكراً لثقتكم بـ Lawrence For PC</div><script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
}

// ─── Invoices List ──────────────────────────────
window.loadInvoices=function(){
  document.getElementById('invoicesListBody').innerHTML='<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text2)">جاري التحميل...</td></tr>';
  onSnapshot(collection(db,'sales'),snap=>{
    allInvoices=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()??0)-(a.createdAt?.toMillis?.()??0));
    document.getElementById('invoicesListBody').innerHTML=allInvoices.length?allInvoices.map(inv=>`
      <tr>
        <td><strong style="color:var(--primary)">${inv.invoiceNumber||'—'}</strong></td>
        <td>${escapeHtml(inv.customerName||'—')}</td>
        <td dir="ltr">${escapeHtml(inv.customerPhone||'—')}</td>
        <td><strong style="color:var(--success)">${(inv.total||0).toFixed(2)} د.أ</strong></td>
        <td style="font-size:12px;color:var(--text2)">${inv.createdAt?.toDate?.()?.toLocaleDateString('ar-JO')||'—'}</td>
        <td class="action-icons">
          <button onclick="reprintInvoice('${inv.id}')" title="طباعة">🖨️</button>
          <button onclick="deleteInvoice('${inv.id}')" title="حذف">🗑️</button>
        </td>
      </tr>`).join(''):'<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text2)">لا توجد فواتير</td></tr>';
  });
};
window.reprintInvoice=function(id){const inv=allInvoices.find(i=>i.id===id);if(!inv)return;printSaleInvoice(inv.customerName||'',inv.customerPhone||'',inv.cart||[],inv.total||0,inv.invoiceNumber||'')};
window.deleteInvoice=async function(id){if(!confirm('حذف هذه الفاتورة؟ سيتم إعادة الكميات للمخزون'))return;const inv=allInvoices.find(i=>i.id===id);if(inv?.cart){for(const item of inv.cart){if(!item.isOther&&item.id)await updateDoc(doc(db,'inventory',item.id),{qty:increment(item.qty)})}}await deleteDoc(doc(db,'sales',id));toast('🗑️ تم حذف الفاتورة')};

// ─── Tab Switching ──────────────────────────────
window.switchTab=function(tab,btn){
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if(btn)btn.classList.add('active');
  if(tab==='list')loadInvoices();
};

function escapeHtml(str){if(!str)return'';return String(str).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
window.doLogout=async function(){await signOut(auth);sessionStorage.removeItem('lpc_user');location.href='index.html'};
</script>
</body>
</html>
