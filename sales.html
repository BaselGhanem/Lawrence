<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lawrence For PC — المبيعات (POS)</title>
<link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/BaselGhanem/Lawrence/refs/heads/main/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
<script>
  const savedTheme = localStorage.getItem('lpc_theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
</script>
<style>
:root{
  --bg:#07090F;--surface:#0D1117;--surface2:#13181F;--border:#1A2235;
  --primary:#F59E0B;--pdim:rgba(245,158,11,.12);--success:#10B981;
  --danger:#EF4444;--text:#F1F5F9;--text2:#94A3B8;--sw:240px;
}
[data-theme="light"]{--bg:#F0F4F8;--surface:#FFFFFF;--surface2:#F1F5F9;--border:#E2E8F0;--text:#0F172A;--text2:#475569}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;transition:background .3s}

/* Sidebar */
.sidebar{width:var(--sw);background:var(--surface);border-left:1px solid var(--border);position:fixed;top:0;right:0;bottom:0;z-index:100}
.sb-brand{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-nav{padding:12px 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;transition:all .2s;color:var(--text2);font-size:14px;font-weight:700;text-decoration:none;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-item.active{background:var(--pdim);color:var(--primary)}

.main{margin-right:var(--sw);flex:1;padding:24px}
.grid-pos{display:grid;grid-template-columns:1fr 380px;gap:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}

/* Elements */
.pos-input{width:100%;padding:14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;margin-bottom:15px;outline:none}
.pos-input:focus{border-color:var(--primary)}
.cart-table{width:100%;border-collapse:collapse}
.cart-table th{text-align:right;padding:10px;color:var(--text2);font-size:12px;border-bottom:1px solid var(--border)}
.cart-table td{padding:12px 10px;border-bottom:1px solid var(--border)}
.total-box{background:var(--surface2);padding:20px;border-radius:12px;margin-top:20px;text-align:center}
.total-val{font-size:32px;font-weight:900;color:var(--primary);margin:10px 0}
.btn{width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:15px;margin-top:10px}
.btn-primary{background:var(--primary);color:#000}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.mode-toggle{display:flex;gap:5px;background:var(--surface2);padding:4px;border-radius:10px;margin-bottom:20px}
.mode-btn{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
.mode-active{background:var(--primary);color:#000}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1A2235;padding:12px 24px;border-radius:10px;z-index:9999;display:none}
.toast.show{display:block}

/* Print Support */
@media print {
  .sidebar, .btn, .mode-toggle, .pos-input, .mode-btn { display: none !important; }
  .main { margin-right: 0 !important; padding: 0 !important; }
  .card { border: none !important; box-shadow: none !important; }
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-brand"><img src="https://raw.githubusercontent.com/BaselGhanem/Lawrence/refs/heads/main/logo.jpg" style="width:40px;border-radius:10px"> <h2>Lawrence</h2></div>
  <nav class="sb-nav">
    <a href="admin.html" class="nav-item">🏠 لوحة الإدارة</a>
    <a href="inventory.html" class="nav-item">📦 المخزون</a>
    <a href="sales.html" class="nav-item active">🛒 المبيعات</a>
    <a href="returns.html" class="nav-item">↩️ المرتجعات</a>
    <a href="reports.html" class="nav-item">📊 التقارير</a>
    <a href="customer.html" class="nav-item" target="_blank">🔍 بوابة العملاء</a>
  </nav>
</div>

<div class="main">
  <div class="grid-pos">
    <div class="card">
      <div class="mode-toggle">
        <button class="mode-btn mode-active" id="btnSale" onclick="setMode('sale')">وضع البيع</button>
        <button class="mode-btn" id="btnReturn" onclick="setMode('return')">وضع المرتجعات</button>
      </div>
      <input type="text" id="posSearch" class="pos-input" placeholder="امسح الباركود أو ابحث عن صنف..." oninput="searchItems()">
      <div id="itemsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:500px;overflow-y:auto"></div>
    </div>

    <div class="card">
      <h3>🛒 السلة</h3>
      <div style="max-height:400px;overflow-y:auto;margin-top:15px">
        <table class="cart-table">
          <thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th></th></tr></thead>
          <tbody id="cartBody"></tbody>
        </table>
      </div>
      <div class="total-box">
        <div style="font-size:14px;color:var(--text2)">الإجمالي المطلوب</div>
        <div class="total-val" id="totalSum">0.00 د.أ</div>
        <button class="btn btn-primary" onclick="completeSale()">إتمام العملية ✓</button>
        <button class="btn btn-primary" style="background:var(--success)" onclick="window.print()">طباعة (PDF)</button>
        <button class="btn btn-danger" onclick="clearCart()">تفريغ السلة</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp, doc, updateDoc, increment } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const CFG={apiKey:"AIzaSyA6xALG_Z-FHMClMSw9GnDey7mJYibnXhY",authDomain:"lorans-2.firebaseapp.com",projectId:"lorans-2",storageBucket:"lorans-2.firebasestorage.app",messagingSenderId:"399952166847",appId:"1:399952166847:web:ac71d3e0d9afe4be8c2b0a"};
const app=initializeApp(CFG); const db=getFirestore(app);

let inventory=[], cart=[], isReturnMode=false;

// استماع لتحديثات المخزون
onSnapshot(collection(db,'inventory'), snap => {
  inventory = snap.docs.map(d=>({id:d.id, ...d.data()}));
  // بعد تحديث المخزون نعيد تطبيق البحث الحالي
  searchItems();
});

// دالة عرض الأصناف (مع دعم التصفية)
function renderItems(itemsToRender = null) {
  const container = document.getElementById('itemsGrid');
  const items = itemsToRender || inventory;
  if (!items.length) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text2)">لا توجد أصناف تطابق البحث</div>';
    return;
  }
  container.innerHTML = items.map(i => `
    <div style="background:var(--surface2);padding:10px;border-radius:8px;cursor:pointer;text-align:center" onclick="addToCart('${i.id}')">
      <div style="font-size:12px;font-weight:700">${escapeHtml(i.name)}</div>
      <div style="color:var(--primary);font-size:13px">${(i.price||0).toFixed(2)} د.أ</div>
      <div style="font-size:10px;color:var(--text2);margin-top:4px">${i.code || ''}</div>
    </div>
  `).join('');
}

// دالة البحث الرئيسية
window.searchItems = function() {
  const query = document.getElementById('posSearch').value.trim().toLowerCase();
  if (!query) {
    // إذا كان الحقل فارغاً نعرض الكل
    renderItems(inventory);
    return;
  }
  const filtered = inventory.filter(item => 
    (item.name && item.name.toLowerCase().includes(query)) ||
    (item.code && item.code.toLowerCase().includes(query)) ||
    (item.cat && item.cat.toLowerCase().includes(query))
  );
  renderItems(filtered);
};

// دالة مساعدة لمنع حقن HTML
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

window.setMode = (m) => {
  isReturnMode = (m === 'return');
  document.getElementById('btnSale').classList.toggle('mode-active', !isReturnMode);
  document.getElementById('btnReturn').classList.toggle('mode-active', isReturnMode);
  toast(isReturnMode ? '⚠️ وضع المرتجعات مفعل' : '✅ وضع البيع مفعل');
};

window.addToCart = function(id) {
  const item = inventory.find(x => x.id === id);
  if(!item) return;
  const existing = cart.find(x => x.id === id);
  if(existing) {
    // التحقق الصحيح من الكمية
    if(!isReturnMode && existing.cartQty + 1 > (item.qty || 0)) { 
      toast('❌ الكمية غير متوفرة في المخزون'); 
      return; 
    }
    existing.cartQty++;
  } else {
    if(!isReturnMode && 1 > (item.qty || 0)) {
      toast('❌ الكمية غير متوفرة');
      return;
    }
    cart.push({...item, cartQty: 1});
  }
  updateCart();
};

window.updateCart = function() {
  let total = 0;
  document.getElementById('cartBody').innerHTML = cart.map((i, idx) => {
    const itemTotal = i.price * i.cartQty;
    total += itemTotal;
    return `<tr>
      <td>${escapeHtml(i.name)}</td>
      <td>${i.cartQty}</td>
      <td>${i.price.toFixed(2)}</td>
      <td><button onclick="rem(${idx})" style="background:none;border:none;color:var(--danger);cursor:pointer">✕</button></td>
    </table>`;
  }).join('');
  document.getElementById('totalSum').textContent = (isReturnMode ? -total : total).toFixed(2) + ' د.أ';
};

window.rem = (idx) => { cart.splice(idx,1); updateCart(); };
window.clearCart = () => { cart=[]; updateCart(); };

window.completeSale = async function() {
  if(cart.length === 0) { toast('⚠️ السلة فارغة'); return; }
  
  // التأكد النهائي من توفر الكميات قبل التنفيذ (للبيع فقط)
  if(!isReturnMode) {
    for(const item of cart) {
      const original = inventory.find(i => i.id === item.id);
      if(!original || (original.qty || 0) < item.cartQty) {
        toast(`❌ الكمية غير كافية للصنف: ${item.name}`);
        return;
      }
    }
  }
  
  const total = cart.reduce((s,i) => s + (i.price * i.cartQty), 0);
  
  // تحديث المخزون لكل صنف
  for(const item of cart) {
    await updateDoc(doc(db, 'inventory', item.id), {
      qty: increment(isReturnMode ? item.cartQty : -item.cartQty)
    });
  }
  
  await addDoc(collection(db,'sales'), {
    cart: cart.map(c => ({ id: c.id, name: c.name, price: c.price, qty: c.cartQty })),
    total: isReturnMode ? -total : total,
    type: isReturnMode ? 'مرتجع' : 'بيع',
    createdAt: serverTimestamp()
  });
  
  cart = []; updateCart();
  toast('✅ تمت العملية بنجاح');
};

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 3000);
}

// باركود سكانر عالمي: يعبئ حقل البحث ويبحث ثم يضيف للعربة (إذا وجد)
let _sbuf='', _stimer=null;
document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  if(['INPUT','TEXTAREA'].includes(tag)) return;
  
  if(e.key === 'Enter') {
    clearTimeout(_stimer);
    if(_sbuf.length >= 3) {
      const code = _sbuf.trim();
      const searchInput = document.getElementById('posSearch');
      if(searchInput) {
        searchInput.value = code;
        searchItems(); // تحديث قائمة الأصناف بناءً على الباركود
      }
      // إضافة الصنف مباشرة إلى السلة إن وجد
      const item = inventory.find(x => x.code === code);
      if(item) addToCart(item.id);
      else toast('❌ الصنف غير موجود');
      _sbuf = '';
    } else {
      _sbuf = '';
    }
    return;
  }
  if(e.key.length === 1) {
    _sbuf += e.key;
    clearTimeout(_stimer);
    _stimer = setTimeout(() => { _sbuf = ''; }, 200);
  }
});
</script>
</body>
</html>
