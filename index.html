<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lawrence For PC — تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07090F;--surface:#0D1117;--surface2:#13181F;--border:#1A2235;
  --primary:#F59E0B;--pdim:rgba(245,158,11,.1);--pdark:#B45309;
  --danger:#EF4444;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569
}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}

/* ANIMATED GRID */
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(245,158,11,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.bg-glow{position:fixed;width:600px;height:600px;background:radial-gradient(circle,rgba(245,158,11,.06) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}

/* LOGIN BOX */
.login-wrap{position:relative;z-index:10;width:100%;max-width:420px;padding:20px}
.brand{text-align:center;margin-bottom:36px}
.brand-icon{width:72px;height:72px;background:linear-gradient(135deg,#F59E0B,#B45309);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 16px;box-shadow:0 16px 40px rgba(245,158,11,.25)}
.brand h1{font-size:26px;font-weight:900;letter-spacing:.3px}
.brand h1 span{color:var(--primary)}
.brand p{color:var(--text2);font-size:13px;margin-top:5px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px}
.card h2{font-size:18px;font-weight:800;margin-bottom:24px}

.f{margin-bottom:18px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px}
.f .input-wrap{position:relative}
.f .input-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none}
.f input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:13px 44px 13px 16px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;outline:none;transition:all .2s}
.f input:focus{border-color:var(--primary);background:var(--pdim);box-shadow:0 0 0 3px rgba(245,158,11,.1)}
.f input::placeholder{color:var(--text3)}

.show-pass{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:2px;transition:color .2s}
.show-pass:hover{color:var(--text2)}

.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#F59E0B,#B45309);border:none;border-radius:12px;color:#000;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:900;cursor:pointer;transition:all .25s;letter-spacing:.3px;margin-top:4px}
.btn-login:hover:not(:disabled){box-shadow:0 8px 28px rgba(245,158,11,.35);transform:translateY(-1px)}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.btn-login.loading{opacity:.7}

.error-msg{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--danger);margin-bottom:18px;display:none;text-align:center}

.footer-link{text-align:center;margin-top:20px}
.footer-link a{color:var(--text3);font-size:12px;text-decoration:none;transition:color .2s}
.footer-link a:hover{color:var(--text2)}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-left:8px}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="login-wrap">
  <div class="brand">
    <div class="brand-icon">💻</div>
    <h1>Lawrence <span>For PC</span></h1>
    <p>نظام إدارة الصيانة</p>
  </div>

  <div class="card">
    <h2>🔐 تسجيل الدخول</h2>
    <div class="error-msg" id="errMsg"></div>

    <div class="f">
      <label>اسم المستخدم</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username" autocapitalize="none">
      </div>
    </div>

    <div class="f">
      <label>كلمة المرور</label>
      <div class="input-wrap">
        <span class="input-icon">🔑</span>
        <input type="password" id="password" placeholder="أدخل كلمة المرور" id="pwField" autocomplete="current-password">
        <button class="show-pass" onclick="togglePass()" tabindex="-1" id="showPassBtn" type="button">👁️</button>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">دخول</button>
  </div>

  <div class="footer-link">
    <a href="customer.html">بوابة العملاء ←</a>
  </div>
</div>

<script type="module">
import { initializeApp }                                   from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc }                       from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const CFG = {
  apiKey:"AIzaSyA6xALG_Z-FHMClMSw9GnDey7mJYibnXhY",
  authDomain:"lorans-2.firebaseapp.com",
  projectId:"lorans-2",
  storageBucket:"lorans-2.firebasestorage.app",
  messagingSenderId:"399952166847",
  appId:"1:399952166847:web:ac71d3e0d9afe4be8c2b0a"
};

const app  = initializeApp(CFG);
const auth = getAuth(app);
const db   = getFirestore(app);

// If already logged in, redirect
onAuthStateChanged(auth, async user => {
  if (user) {
    const profile = await getProfile(user.uid);
    if (profile) {
      sessionStorage.setItem('lpc_user', JSON.stringify({ uid: user.uid, ...profile }));
      redirect(profile.role);
    }
  }
});

function redirect(role) {
  if (role === 'admin') location.href = 'admin.html';
  else location.href = 'technician.html';
}

async function getProfile(uid) {
  const snap = await getDoc(doc(db, 'users', uid));
  return snap.exists() ? snap.data() : null;
}

function showErr(msg) {
  const el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideErr() { document.getElementById('errMsg').style.display = 'none'; }

window.togglePass = function() {
  const f = document.getElementById('password');
  const b = document.getElementById('showPassBtn');
  if (f.type === 'password') { f.type = 'text'; b.textContent = '🙈'; }
  else { f.type = 'password'; b.textContent = '👁️'; }
};

window.doLogin = async function() {
  const username = document.getElementById('username').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');

  if (!username) { showErr('يرجى إدخال اسم المستخدم'); return; }
  if (!password) { showErr('يرجى إدخال كلمة المرور'); return; }

  hideErr();
  btn.disabled = true;
  btn.innerHTML = 'جاري الدخول <span class="spinner"></span>';

  try {
    const email = `${username}@lorans.local`;
    const cred  = await signInWithEmailAndPassword(auth, email, password);
    const profile = await getProfile(cred.user.uid);

    if (!profile) {
      showErr('الحساب غير موجود في النظام، تواصل مع المدير');
      btn.disabled = false;
      btn.textContent = 'دخول';
      return;
    }

    if (profile.active === false) {
      showErr('هذا الحساب معطّل، تواصل مع المدير');
      btn.disabled = false;
      btn.textContent = 'دخول';
      return;
    }

    sessionStorage.setItem('lpc_user', JSON.stringify({ uid: cred.user.uid, ...profile }));
    redirect(profile.role);

  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'دخول';
    if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
      showErr('اسم المستخدم أو كلمة المرور غير صحيحة');
    } else if (e.code === 'auth/too-many-requests') {
      showErr('محاولات كثيرة، انتظر قليلاً ثم حاول مجدداً');
    } else {
      showErr('خطأ في الاتصال: ' + e.message);
    }
  }
};

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') window.doLogin();
});
</script>
</body>
</html>
