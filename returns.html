<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lawrence For PC — المرتجعات</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="stylesheet" href="style.css">
<style>
.detail-row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--border); font-size:13px; }
.invoice-items { background:var(--surface2); border-radius:9px; padding:10px; margin:10px 0; }
</style>
</head>
<body>

<script src="scripts.js"></script>

<!-- Sidebar injected by scripts.js -->
<div id="app-sidebar"></div>

<div class="main">
  <div class="page-header">
    <div><h1>↩️ نظام المرتجعات</h1><p>إدارة استرجاع المنتجات — يؤثر على المخزون والتقارير</p></div>
    <button class="btn btn-primary" onclick="openNewReturn()">+ إنشاء مرتجع</button>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>رقم المرتجع</th><th>المرجع</th><th>العميل</th>
          <th>المبلغ</th><th>السبب</th><th>الحالة</th><th>إجراء</th>
        </tr></thead>
        <tbody id="returnsBody">
          <tr><td colspan="7" style="text-align:center;color:var(--text2);padding:28px">جاري التحميل...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal: إنشاء مرتجع -->
<div class="overlay" id="m-return">
<div class="modal sm">
  <div class="modal-head"><div class="modal-title">↩️ إنشاء مرتجع جديد</div><button class="close-x" onclick="closeModal('m-return')">✕</button></div>
  <div class="f mb-12"><label>نوع المرتجع</label>
    <select id="r-type"><option value="Sale">مبيعات</option><option value="Maintenance">صيانة</option></select>
  </div>
  <div class="f mb-12"><label>رقم الفاتورة / الطلب</label>
    <input id="r-ref" placeholder="مثال: SALE-12345 أو LPC-001">
  </div>
  <div class="f mb-16"><label>سبب الإرجاع</label>
    <select id="r-reason">
      <option>منتج تالف</option>
      <option>عدم مطابقة المواصفات</option>
      <option>خطأ في الطلب</option>
      <option>رغبة العميل</option>
    </select>
  </div>
  <div style="display:flex;gap:9px;justify-content:flex-end">
    <button class="btn btn-outline" onclick="closeModal('m-return')">إلغاء</button>
    <button class="btn btn-primary" onclick="saveReturn()">حفظ الطلب ✓</button>
  </div>
</div></div>

<!-- Modal: قبول مرتجع -->
<div class="overlay" id="m-approve">
<div class="modal">
  <div class="modal-head"><div class="modal-title">✅ قبول المرتجع</div><button class="close-x" onclick="closeModal('m-approve')">✕</button></div>
  <div id="approveDetails"></div>
  <div class="f mt-12 mb-16"><label>مبلغ المرتجع (JOD)</label>
    <input type="number" id="returnAmount" step="0.01" placeholder="0.00">
  </div>
  <div style="display:flex;gap:9px;justify-content:flex-end">
    <button class="btn btn-outline" onclick="closeModal('m-approve')">إلغاء</button>
    <button class="btn btn-success" onclick="confirmApprove()">تأكيد المرتجع ✓</button>
  </div>
</div></div>

<div id="toast" class="toast"></div>
<div id="scanIndicator" class="scan-indicator">📡 <span id="scanCode"></span></div>

<script type="module">
import { initializeApp }          from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signOut, onAuthStateChanged }  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
         onSnapshot, getDoc, getDocs, serverTimestamp, increment }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const CFG = {
  apiKey:'AIzaSyA6xALG_Z-FHMClMSw9GnDey7mJYibnXhY',
  authDomain:'lorans-2.firebaseapp.com',
  projectId:'lorans-2',
  storageBucket:'lorans-2.firebasestorage.app',
  messagingSenderId:'399952166847',
  appId:'1:399952166847:web:ac71d3e0d9afe4be8c2b0a',
};
const app  = initializeApp(CFG);
const auth = getAuth(app);
const db   = getFirestore(app);

let allReturns = [], pendingApproveId = null;

// ── AUTH ──────────────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if (!user) { location.href = 'index.html'; return; }
  const u = JSON.parse(sessionStorage.getItem('lpc_user') || '{}');
  if (u.role !== 'admin') { location.href = 'technician.html'; return; }
  renderSidebar('returns');
});

// ── LIVE DATA ─────────────────────────────────────────────────────
onSnapshot(collection(db, 'returns'), snap => {
  allReturns = snap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  renderReturnsTable();
});

function renderReturnsTable() {
  const tbody = document.getElementById('returnsBody');
  if (!allReturns.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text2);padding:28px">لا توجد مرتجعات حتى الآن</td></tr>';
    return;
  }
  tbody.innerHTML = allReturns.map(r => `
    <tr>
      <td><strong style="color:var(--primary)">${r.returnId || r.id.slice(0,8)}</strong></td>
      <td>${r.refId}</td>
      <td>${r.customerName || '—'}</td>
      <td><strong>${(r.amount || 0).toFixed(2)} د.أ</strong></td>
      <td style="font-size:12px;color:var(--text2)">${r.reason}</td>
      <td><span class="badge ${r.status === 'Pending' ? 'b-pending' : 'b-approved'}">${r.status === 'Pending' ? 'قيد الانتظار' : 'مُعتمد'}</span></td>
      <td style="display:flex;gap:6px">
        ${r.status === 'Pending'
          ? `<button class="btn btn-success btn-sm" onclick="prepareApprove('${r.id}')">✅ قبول</button>
             <button class="btn btn-danger btn-sm" onclick="rejectReturn('${r.id}')">🗑️ رفض</button>`
          : '<span style="color:var(--text3);font-size:12px">مُكتمل</span>'}
      </td>
    </tr>
  `).join('');
}

// ── OPEN NEW RETURN ───────────────────────────────────────────────
window.openNewReturn = () => {
  document.getElementById('r-ref').value = '';
  openModal('m-return');
};

// ── SAVE RETURN ───────────────────────────────────────────────────
window.saveReturn = async () => {
  const refId  = document.getElementById('r-ref').value.trim();
  const type   = document.getElementById('r-type').value;
  const reason = document.getElementById('r-reason').value;
  if (!refId) { toast('⚠️ يرجى إدخال رقم الفاتورة'); return; }

  // البحث عن الفاتورة — ✅ استخدام getDocs الصحيح من Firebase
  let foundSale = null;
  if (type === 'Sale') {
    const salesSnap = await getDocs(collection(db, 'sales'));
    salesSnap.forEach(docSnap => {
      const data = docSnap.data();
      if (data.invoiceNumber === refId || docSnap.id === refId) {
        foundSale = { id: docSnap.id, ...data };
      }
    });
    if (!foundSale) { toast('⚠️ لم يتم العثور على فاتورة بهذا الرقم'); return; }
  }

  const returnData = {
    returnId: 'RET-' + Date.now(),
    refId, type, reason,
    status: 'Pending',
    amount: foundSale?.total || 0,
    customerName: foundSale?.customerName || 'غير محدد',
    saleId: foundSale?.id || null,
    createdAt: serverTimestamp(),
  };
  await addDoc(collection(db, 'returns'), returnData);
  closeModal('m-return');
  toast('✅ تم إنشاء طلب المرتجع');
};

// ── PREPARE APPROVE ───────────────────────────────────────────────
window.prepareApprove = async (returnId) => {
  const ret = allReturns.find(r => r.id === returnId);
  if (!ret) return;
  pendingApproveId = returnId;

  document.getElementById('returnAmount').value = ret.amount || 0;

  const detailsDiv = document.getElementById('approveDetails');
  if (ret.saleId) {
    const saleSnap = await getDoc(doc(db, 'sales', ret.saleId));
    if (saleSnap.exists()) {
      const sale = saleSnap.data();
      let html = '<div class="invoice-items"><strong>أصناف الفاتورة:</strong>';
      (sale.cart || []).forEach(item => {
        html += `<div class="detail-row"><span>${item.name}</span><span>${item.qty} × ${item.price} = ${(item.qty * item.price).toFixed(2)} د.أ</span></div>`;
      });
      html += `</div><div class="detail-row"><strong>الإجمالي الأصلي:</strong><span>${(sale.total || 0).toFixed(2)} د.أ</span></div>`;
      detailsDiv.innerHTML = html;
    } else {
      detailsDiv.innerHTML = `<p style="color:var(--text2);font-size:13px">المبلغ الافتراضي: ${ret.amount || 0} د.أ</p>`;
    }
  } else {
    detailsDiv.innerHTML = `<p style="color:var(--text2);font-size:13px">مرتجع صيانة — المبلغ: ${ret.amount || 0} د.أ</p>`;
  }
  openModal('m-approve');
};

// ── CONFIRM APPROVE ───────────────────────────────────────────────
window.confirmApprove = async () => {
  const amount = parseFloat(document.getElementById('returnAmount').value);
  if (isNaN(amount) || amount <= 0) { toast('⚠️ أدخل مبلغاً صحيحاً'); return; }

  const ret = allReturns.find(r => r.id === pendingApproveId);
  if (!ret) return;

  // 1. تحديث حالة المرتجع
  await updateDoc(doc(db, 'returns', pendingApproveId), {
    status: 'Approved', approvedAmount: amount, approvedAt: serverTimestamp(),
  });

  // 2. إعادة الكميات للمخزون إذا كانت فاتورة مبيعات
  if (ret.saleId) {
    const saleSnap = await getDoc(doc(db, 'sales', ret.saleId));
    if (saleSnap.exists()) {
      const sale = saleSnap.data();
      if (sale.cart && Array.isArray(sale.cart)) {
        // ✅ استخدام getDocs الصحيح للبحث في المخزون
        const invSnap = await getDocs(collection(db, 'inventory'));
        const invMap  = {};
        invSnap.forEach(d => { invMap[d.data().name] = d.id; });

        for (const item of sale.cart) {
          if (!item.isOther) {
            const invId = item.id || invMap[item.name];
            if (invId) await updateDoc(doc(db, 'inventory', invId), { qty: increment(item.qty) });
          }
        }
      }
      await updateDoc(doc(db, 'sales', ret.saleId), {
        returned: true, returnedAmount: amount, returnedDate: serverTimestamp(),
      });
    }
  }

  // 3. تسجيل كمصروف في التقارير
  await addDoc(collection(db, 'expenses'), {
    name: `مرتجع — ${ret.refId}`,
    amount, category: 'مرتجعات',
    date: new Date().toISOString().split('T')[0],
    createdAt: serverTimestamp(),
  });

  closeModal('m-approve');
  toast('✅ تم اعتماد المرتجع وتحديث المخزون');
};

// ── REJECT ────────────────────────────────────────────────────────
window.rejectReturn = async (id) => {
  document.getElementById('toast').textContent = '';
  if (!confirm('هل أنت متأكد من رفض وحذف هذا المرتجع؟')) return;
  await deleteDoc(doc(db, 'returns', id));
  toast('🗑️ تم رفض المرتجع وحذفه');
};

// Override doLogout with Firebase signOut
window.doLogout = async function () {
  await signOut(auth);
  sessionStorage.removeItem('lpc_user');
  location.href = 'index.html';
};
</script>
</body>
</html>
